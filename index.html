<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Planner</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      padding: 20px;
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .auth-brand-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--accent-gradient);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .auth-brand-icon svg { width: 36px; height: 36px; color: #fff; }
    .auth-brand h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .auth-brand h1 span { color: var(--accent); }
    .auth-brand p {
      color: var(--text-secondary);
      font-size: 0.938rem;
      margin-top: 4px;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 32px;
    }
    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-tertiary);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: none;
      background: none;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }
    .auth-tab.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-form .input-group { margin-bottom: 18px; }
    .auth-form .input-field {
      padding: 12px 16px;
      font-size: 0.938rem;
    }
    .auth-form .btn-primary {
      width: 100%;
      padding: 13px;
      font-size: 0.938rem;
      margin-top: 8px;
    }
    .auth-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.813rem;
      margin-bottom: 16px;
      display: none;
    }
    .auth-error.visible { display: block; }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.813rem;
      color: var(--text-muted);
    }
    .theme-toggle-auth {
      position: absolute;
      top: 20px;
      right: 20px;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="theme-toggle-auth">
      <label class="toggle-switch">
        <input type="checkbox" id="theme-toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="auth-container">
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/>
          </svg>
        </div>
        <h1>School<span>Planner</span></h1>
        <p>Dein digitaler Schulmanager</p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchAuthTab('login')">Anmelden</button>
          <button class="auth-tab" onclick="switchAuthTab('register')">Registrieren</button>
        </div>

        <div id="auth-error" class="auth-error"></div>

        <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
          <div class="input-group">
            <label for="login-email">E-Mail</label>
            <input type="email" id="login-email" class="input-field" placeholder="name@schule.de" required>
          </div>
          <div class="input-group">
            <label for="login-password">Passwort</label>
            <input type="password" id="login-password" class="input-field" placeholder="Passwort eingeben" required>
          </div>
          <button type="submit" class="btn btn-primary" id="login-btn">Anmelden</button>
        </form>

        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
          <div class="input-group">
            <label for="reg-name">Vollständiger Name</label>
            <input type="text" id="reg-name" class="input-field" placeholder="Max Mustermann" required>
          </div>
          <div class="input-group">
            <label for="reg-class">Klasse</label>
            <input type="text" id="reg-class" class="input-field" placeholder="z.B. 10b">
          </div>
          <div class="input-group">
            <label for="reg-email">E-Mail</label>
            <input type="email" id="reg-email" class="input-field" placeholder="name@schule.de" required>
          </div>
          <div class="input-group">
            <label for="reg-password">Passwort</label>
            <input type="password" id="reg-password" class="input-field" placeholder="Min. 6 Zeichen" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" id="register-btn">Konto erstellen</button>
        </form>
      </div>

      <div class="auth-footer">
        School Planner &mdash; Kostenlos & Open Source
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    initTheme();

    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.getElementById('auth-error').classList.remove('visible');

      if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
    }

    function showAuthError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.add('visible');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.textContent = 'Anmelden...';
      btn.disabled = true;
      try {
        await signIn(
          document.getElementById('login-email').value,
          document.getElementById('login-password').value
        );
        window.location.href = 'app.html';
      } catch (err) {
        const messages = {
          'Invalid login credentials': 'E-Mail oder Passwort falsch.',
          'Email not confirmed': 'Bitte bestätige zuerst deine E-Mail-Adresse.'
        };
        showAuthError(messages[err.message] || err.message);
      } finally {
        btn.textContent = 'Anmelden';
        btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      btn.textContent = 'Konto erstellen...';
      btn.disabled = true;
      try {
        await signUp(
          document.getElementById('reg-email').value,
          document.getElementById('reg-password').value,
          document.getElementById('reg-name').value,
          document.getElementById('reg-class').value
        );
        showAuthError('Bitte bestätige deine E-Mail-Adresse um fortzufahren.');
        document.getElementById('auth-error').style.background = 'rgba(34,197,94,0.1)';
        document.getElementById('auth-error').style.borderColor = 'rgba(34,197,94,0.2)';
        document.getElementById('auth-error').style.color = 'var(--success)';
      } catch (err) {
        const messages = {
          'User already registered': 'Diese E-Mail ist bereits registriert.',
          'Password should be at least 6 characters': 'Passwort muss mindestens 6 Zeichen lang sein.'
        };
        showAuthError(messages[err.message] || err.message);
      } finally {
        btn.textContent = 'Konto erstellen';
        btn.disabled = false;
      }
    }

    (async () => {
      await initAuth();
      if (currentUser) window.location.href = 'app.html';
    })();
  </script>
</body>
</html>
